map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

map $scheme $socket_origin {
    https wss://$http_host;
    default ws://$http_host;
}

server {
    listen 80;
    listen 443 ssl;
    ssl_certificate /etc/nginx/tls/cert.pem;
    ssl_certificate_key /etc/nginx/tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /usr/share/nginx/html;
    access_log off;
    error_log /dev/stderr warn;
    client_max_body_size 4m;
    resolver 127.0.0.11 valid=3s ipv6=off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' $socket_origin; worker-src 'self' blob:; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'" always;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 65s;

    location /api/auth/ {
        set $backend http://auth:8000;
        proxy_pass $backend;
    }
    location /api/edu/ {
        set $backend http://education-api:8000;
        proxy_pass $backend;
    }
    location /api/contest/ {
        set $backend http://contest:8000;
        proxy_pass $backend;
    }
    location = /ws/edu {
        set $backend http://education-api:8000;
        proxy_pass $backend;
    }
    location /ws/contest/ {
        set $backend http://contest:8000;
        proxy_pass $backend;
    }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }
    location / {
        try_files $uri /index.html;
    }
}
