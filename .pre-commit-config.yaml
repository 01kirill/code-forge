repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff lint
        entry: uv run --locked ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format
        entry: uv run --locked ruff format --check
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run --locked mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: uv run --locked pytest -q -m "not integration"
        language: system
        types: [python]
        pass_filenames: false
      - id: frontend-typecheck
        name: Frontend type check
        entry: npm --prefix frontend run typecheck
        language: system
        files: '^(frontend/.*\.(ts|tsx|json)|app/codeforge/common/judge_languages\.json)$'
        pass_filenames: false
